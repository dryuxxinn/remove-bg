<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background and Object Remover - bgasrdy</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Palette Elegan ala CasaOS */
            --bg-base: #0f172a;
            --bg-surface: rgba(30, 41, 59, 0.6); 
            --border-glass: rgba(255, 255, 255, 0.06);
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main); 
            background: radial-gradient(circle at top left, #1e293b 0%, #020617 100%);
            min-height: 100vh;
            display: flex;
            overflow: hidden; 
        }

        /* --- APP LAYOUT --- */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* --- SIDEBAR (TOOLS AREA) --- */
        .sidebar {
            width: 320px;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            padding: 24px;
            flex-shrink: 0;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .brand-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #fff;
        }
        .brand-text h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
        .brand-text p { font-size: 11px; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 1px; font-weight: 500;}

        .section-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border-glass); }

        .btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-1px); }
        .btn svg { width: 16px; height: 16px; opacity: 0.7; }
        
        .btn-primary { background: var(--accent-blue); border-color: transparent; }
        .btn-primary:hover { background: var(--accent-blue-hover); }
        .btn-danger { color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

        .slider-group { font-size: 12px; color: var(--text-muted); padding: 10px 0;}
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-top: 8px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--accent-cyan); cursor: pointer; margin-top: -5px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; }

        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(14, 165, 233, 0.05);
            border: 1.5px dashed rgba(14, 165, 233, 0.4);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            margin-bottom: 10px;
        }
        .upload-label:hover { background: rgba(14, 165, 233, 0.1); border-color: var(--accent-cyan); }
        .upload-label svg { color: var(--accent-cyan); margin-bottom: 8px; width: 24px; height: 24px; }
        .upload-label span { font-size: 13px; font-weight: 500; color: var(--accent-cyan); }
        input[type="file"] { display: none; }

        /* --- WATERMARK FOOTER (LINKEDIN & PORTO) --- */
        .sidebar-footer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-glass);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .watermark-text {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .watermark-text span {
            color: var(--accent-cyan);
            font-weight: 600;
        }
        .social-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .social-btn:hover {
            background: rgba(14, 165, 233, 0.1);
            color: #fff;
            border-color: var(--accent-cyan);
        }
        .social-btn svg { width: 14px; height: 14px; }

        /* --- MAIN WORKSPACE --- */
        .workspace-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: auto;
            padding: 20px;
        }

        .checkerboard {
            background-image: repeating-linear-gradient(45deg, #1e293b 25%, transparent 25%, transparent 75%, #1e293b 75%, #1e293b), 
                              repeating-linear-gradient(45deg, #1e293b 25%, #0f172a 25%, #0f172a 75%, #1e293b 75%, #1e293b);
            background-position: 0 0, 12px 12px; background-size: 24px 24px;
        }

        .canvas-container {
            margin: 0 auto;
            max-width: 100% !important;
            touch-action: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        #resultImage {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hidden { display: none !important; }
        
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .empty-state svg { width: 64px; height: 64px; opacity: 0.3; }

        .loader-box { text-align: center; color: var(--accent-cyan); font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 15px;}
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; flex: none; }
            .workspace-area { min-height: 500px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- SIDEBAR (TOOLBOX) -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">AI</div>
                <div class="brand-text">
                    <h1>Background and Object Remover</h1>
                    <p>bgasrdy</p>
                </div>
            </div>

            <!-- Upload Area -->
            <label for="imageInput" class="upload-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span>Pilih atau Tarik Gambar</span>
                <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">PNG, JPG (Max 20MB)</span>
            </label>
            <input type="file" id="imageInput" accept="image/*" onchange="setupWorkspace()">

            <!-- AI Engine Tools -->
            <div class="section-title">✨ AI Engine</div>
            <button class="btn btn-primary" onclick="runAPI('remove-bg')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                Hapus Background (Auto)
            </button>
            <button class="btn" onclick="runAPI('remove-object-auto')" style="border-color: rgba(245, 158, 11, 0.4); color: #fcd34d;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Ekstrak Latar Saja
            </button>

            <!-- Manual Editor Tools -->
            <div class="section-title">🎯 Manual Masking</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="btn" onclick="addShape('rect')" style="margin:0; justify-content:center;">+ Kotak</button>
                <button class="btn" onclick="addShape('circle')" style="margin:0; justify-content:center;">+ Lingkar</button>
            </div>
            
            <div class="slider-group">
                <div style="display: flex; justify-content: space-between;">
                    <span>Radius Sudut Box</span>
                    <span id="radiusVal" style="color:#fff; font-weight:bold;">15</span>
                </div>
                <input type="range" id="radiusSlider" min="0" max="100" value="15" oninput="updateRadius(this.value)">
            </div>

            <button class="btn" onclick="deleteSelected()" style="font-size: 12px; color: var(--text-muted); border: none; background: transparent; padding: 5px;">
                Hapus Bentuk Aktif (Del)
            </button>

            <button class="btn btn-danger" onclick="runShapeEraser()" style="margin-top: 10px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                Lubangi Area (Eraser)
            </button>

            <!-- Spacer biar tombol batal gak dempet -->
            <div style="flex: 1;"></div>

            <!-- Tombol Reset -->
            <button class="btn" onclick="location.reload()" style="background: transparent; border-style: dashed; margin-top: 20px;">
                Batal & Reset Workspace
            </button>

            <!-- WATERMARK LU DISINI -->
            <div class="sidebar-footer">
                <div class="watermark-text">Engineered & Designed by <span>Bergas Ardiansyah</span></div>
                <div class="social-buttons">
                    <a href="https://www.linkedin.com/in/bgasrdy/" target="_blank" class="social-btn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                        LinkedIn
                    </a>
                    <a href="https://bgasrdy.cloud" target="_blank" class="social-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                        Portfolio
                    </a>
                </div>
            </div>

        </aside>

        <!-- MAIN WORKSPACE -->
        <main class="workspace-area checkerboard" id="mainWorkspace">
            
            <div id="emptyState" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <div>
                    <h3 style="color: var(--text-main); margin-bottom: 5px; font-weight: 500;">Workspace Kosong</h3>
                    <p style="font-size: 13px;">Pilih gambar dari panel kiri untuk mulai mengedit.</p>
                </div>
            </div>

            <div id="canvasWrapper" class="hidden">
                <canvas id="mainCanvas"></canvas>
            </div>

            <div id="loadingState" class="loader-box hidden">
                <svg class="spinner" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"></path></svg>
                <p>Engine AI sedang memproses gambar...<br><span style="font-size: 12px; color: var(--text-muted); font-weight: 400;">Harap tunggu beberapa detik.</span></p>
            </div>

            <div id="resultWrapper" class="hidden" style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%;">
                <img id="resultImage" src="">
                <a id="downloadLink" href="" download="hasil_aistudio.png" style="text-decoration: none;">
                    <button class="btn btn-primary" style="width: auto; padding: 12px 40px; border-radius: 30px; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Unduh Gambar Transparan
                    </button>
                </a>
            </div>

        </main>
    </div>

    <script>
        let currentFile = null;
        let canvas; 

        function showView(viewId) {
            ['emptyState', 'canvasWrapper', 'loadingState', 'resultWrapper'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function setupWorkspace() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return;
            currentFile = file;
            
            if (canvas) { canvas.dispose(); }
            canvas = new fabric.Canvas('mainCanvas', { selection: true });

            const imageUrl = URL.createObjectURL(file);
            fabric.Image.fromURL(imageUrl, function(img) {
                const workspace = document.getElementById('mainWorkspace');
                const padding = 40;
                const maxWidth = workspace.clientWidth - padding;
                const maxHeight = workspace.clientHeight - padding;

                let scale = 1;
                if (img.width > maxWidth || img.height > maxHeight) {
                    const scaleX = maxWidth / img.width;
                    const scaleY = maxHeight / img.height;
                    scale = Math.min(scaleX, scaleY);
                }
                
                canvas.setWidth(img.width * scale);
                canvas.setHeight(img.height * scale);
                
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    scaleX: scale, scaleY: scale
                });
                
                canvas.on('object:scaling', function(e) {
                    const obj = e.target;
                    if (obj.type === 'rect') {
                        const newWidth = obj.width * obj.scaleX;
                        const newHeight = obj.height * obj.scaleY;
                        obj.set({ width: newWidth, height: newHeight, scaleX: 1, scaleY: 1 });
                        obj.setCoords();
                    }
                });

                showView('canvasWrapper');
                canvas.calcOffset();
                canvas.renderAll();
            });
        }

        function addShape(type) {
            if(!canvas) return alert("Pilih atau tarik gambar dulu ke dalam aplikasi!");
            let shape;
            const center = canvas.getCenter();
            const commonProps = {
                left: center.left, top: center.top,
                fill: 'rgba(239, 68, 68, 0.5)', 
                originX: 'center', originY: 'center',
                transparentCorners: false, cornerColor: '#06b6d4', borderColor: '#06b6d4', cornerSize: 12
            };

            if (type === 'rect') {
                const currentRadius = parseInt(document.getElementById('radiusSlider').value);
                shape = new fabric.Rect({ ...commonProps, width: 200, height: 150, rx: currentRadius, ry: currentRadius });
            } else if (type === 'circle') {
                shape = new fabric.Circle({ ...commonProps, radius: 80 });
            }

            canvas.add(shape);
            canvas.setActiveObject(shape); 
        }

        function updateRadius(val) {
            document.getElementById('radiusVal').innerText = val;
            if(!canvas) return;
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.type === 'rect') {
                activeObj.set({ rx: parseInt(val), ry: parseInt(val) });
                canvas.renderAll();
            }
        }

        canvas?.on('selection:created', checkRadius);
        canvas?.on('selection:updated', checkRadius);
        function checkRadius(e) {
            if(e.selected[0] && e.selected[0].type === 'rect') {
                document.getElementById('radiusSlider').value = e.selected[0].rx || 0;
                document.getElementById('radiusVal').innerText = e.selected[0].rx || 0;
            }
        }

        function deleteSelected() {
            if(!canvas) return;
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject();
                activeObjects.forEach(function(object) { canvas.remove(object); });
            }
        }

        window.addEventListener('keydown', (e) => {
            if((e.key === 'Delete' || e.key === 'Backspace') && canvas && canvas.getActiveObjects().length > 0) {
                deleteSelected();
            }
        });

        function generateMaskBlob() {
            return new Promise((resolve) => {
                const activeObj = canvas.getActiveObject();
                canvas.discardActiveObject();
                
                const originalBg = canvas.backgroundImage;
                canvas.setBackgroundImage(null, canvas.renderAll.bind(canvas));
                canvas.backgroundColor = 'black';
                
                const objs = canvas.getObjects();
                const originalFills = [];
                objs.forEach(obj => {
                    originalFills.push(obj.fill);
                    obj.set('fill', 'white');
                });
                
                canvas.renderAll();
                
                canvas.getElement().toBlob((blob) => {
                    canvas.backgroundColor = '';
                    canvas.setBackgroundImage(originalBg, canvas.renderAll.bind(canvas));
                    objs.forEach((obj, i) => obj.set('fill', originalFills[i]));
                    if (activeObj) { canvas.setActiveObject(activeObj); }
                    canvas.renderAll();
                    resolve(blob);
                }, 'image/png');
            });
        }

        async function runShapeEraser() {
            if(!currentFile) return alert("Upload gambar terlebih dahulu!");
            showView('loadingState');
            const maskBlob = await generateMaskBlob();
            
            const formData = new FormData();
            formData.append('image', currentFile);
            formData.append('mask', maskBlob);

            try {
                const res = await fetch('/magic-eraser/', { method: 'POST', body: formData });
                if(!res.ok) throw new Error("Gagal");
                displayResult(await res.blob());
            } catch (e) { 
                alert("Server error! Pastikan backend berjalan aman."); 
                showView('canvasWrapper'); 
            }
        }

        async function runAPI(endpoint) {
            if(!currentFile) return alert("Upload gambar terlebih dahulu!");
            showView('loadingState');
            const formData = new FormData();
            formData.append('file', currentFile);
            try {
                const res = await fetch(`/${endpoint}/`, { method: 'POST', body: formData });
                if(!res.ok) throw new Error("Gagal");
                displayResult(await res.blob());
            } catch (e) { 
                alert("Server error!"); 
                showView('canvasWrapper'); 
            }
        }

        function displayResult(blob) {
            const url = URL.createObjectURL(blob);
            document.getElementById('resultImage').src = url;
            document.getElementById('downloadLink').href = url;
            showView('resultWrapper');
        }
    </script>
</body>
</html>
